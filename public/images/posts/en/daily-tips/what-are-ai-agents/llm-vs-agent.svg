<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="28" y="40" width="400" height="296" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><rect x="48" y="62" width="360" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="228" y="84" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">LLM — one turn</text><circle cx="62" cy="142" r="6" fill="#2563eb"/><text x="82" y="148" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Text in, text out</text><circle cx="62" cy="190" r="6" fill="#2563eb"/><text x="82" y="196" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Answers from memory</text><circle cx="62" cy="238" r="6" fill="#2563eb"/><text x="82" y="244" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">No tools, no memory</text><circle cx="62" cy="286" r="6" fill="#2563eb"/><text x="82" y="292" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">You drive every step</text><rect x="452" y="40" width="400" height="296" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><rect x="472" y="62" width="360" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="652" y="84" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">AI agent — a loop</text><circle cx="486" cy="142" r="6" fill="#16a34a"/><text x="506" y="148" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Takes a goal and plans</text><circle cx="486" cy="190" r="6" fill="#16a34a"/><text x="506" y="196" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Calls tools, reads results</text><circle cx="486" cy="238" r="6" fill="#16a34a"/><text x="506" y="244" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Keeps state across steps</text><circle cx="486" cy="286" r="6" fill="#16a34a"/><text x="506" y="292" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Checks and retries</text><text x="440" y="378" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#475569">the agent is the model plus a harness that lets it act</text></svg>

