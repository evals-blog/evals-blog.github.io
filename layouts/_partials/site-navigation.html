<nav class="pv2 pv3-ns ph3 ph4-ns" role="navigation">
  <style>
    .brand-logo {
      display: block;
      width: clamp(220px, 34vw, 500px);
      height: auto;
      max-width: 100%;
      object-fit: contain;
      flex-shrink: 0;
    }

    .nav-mobile-shell > div:first-child {
      flex-shrink: 0;
    }

    @media (max-width: 35em) {
      .brand-logo {
        width: clamp(200px, 62vw, 340px);
        height: auto;
      }

      .nav-mobile-shell {
        align-items: flex-start;
      }

      .mobile-lang-group {
        width: 100%;
        justify-content: flex-start;
        margin-top: 0.25rem;
      }
    }

    @media (min-width: 35.01em) and (max-width: 64em) {
      .brand-logo {
        width: clamp(260px, 35vw, 440px);
        height: auto;
      }

      .mobile-lang-group {
        width: 100%;
        justify-content: flex-start;
        margin-top: 0.25rem;
      }
    }

    @media (min-width: 60em) {
      .brand-logo {
        width: clamp(320px, 30vw, 620px);
        height: auto;
      }
    }
  </style>
  <div class="nav-mobile-shell flex flex-column flex-row-l center items-center justify-between w-100">
    <div class="flex items-center justify-center w-100 w-auto-l mb2 mb0-l" style="flex: 1 1 0%;">
      {{ with .Site.Params.site_logo }}
        <a href="{{ $.Site.Home.RelPermalink }}" class="f3 fw2 hover-white white-90 dib no-underline" aria-label="{{ $.Site.Title }}" style="display:flex; align-items:center; justify-content:center;">
          <img src="{{ urls.RelURL . }}" alt="{{ $.Site.Title }}" class="brand-logo" />
        </a>
      {{ else }}
        <a href="{{ .Site.Home.RelPermalink }}" class="f3 fw2 hover-white white-90 dib no-underline">
          {{ .Site.Title }}
        </a>
      {{ end }}
    </div>
    <div class="flex-l items-center justify-center mobile-lang-group">
      {{ partials.Include "i18nlist.html" . }}
      {{ if .Site.Menus.main }}
        <ul class="{{ compare.Conditional (compare.Eq $.Site.Language.Direction "rtl") "pr0 ml3" "pl0 mr3" }}">
          {{ range .Site.Menus.main }}
          <li class="list f5 f4-ns fw4 dib {{ compare.Conditional (compare.Eq $.Site.Language.Direction "rtl") "pl3" "pr3" }}">
            <a class="hover-white white-90 no-underline" href="{{ .URL }}" title="{{ lang.Translate "pageTitle" . }}">
              {{ .Name }}
            </a>
          </li>
          {{ end }}
        </ul>
      {{ end }}
      {{ partials.IncludeCached "social/follow.html" . }}
    </div>
  </div>
</nav>
