<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 873" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="44" y="36" width="792" height="229" rx="20" fill="#ffffff" stroke="#fecaca" stroke-width="2"/><rect x="66" y="52" width="170" height="34" rx="10" fill="#dc2626" stroke="#cbd5e1" stroke-width="1.5"/><text x="151" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Yếu — mơ hồ</text><text x="66" y="108" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">Prompt</text><text x="66" y="128" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Giúp mình làm marketing với.</text><text x="66" y="168" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">Model reply</text><text x="66" y="188" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">Chắc chắn rồi! Marketing là tiếp cận khách hàng. Nó quan trọng vì…</text><rect x="44" y="295" width="792" height="578" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/><rect x="66" y="311" width="170" height="34" rx="10" fill="#16a34a" stroke="#cbd5e1" stroke-width="1.5"/><text x="151" y="333" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Mạnh — cụ thể</text><text x="66" y="367" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">Prompt</text><text x="66" y="387" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Bạn là copywriter B2B SaaS. Viết 3 tiêu đề email cho webinar về</text><text x="66" y="411" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">bảo mật dữ liệu, nhắm tới quản lý IT. Mỗi tiêu đề dưới 45 ký</text><text x="66" y="435" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">tự, không emoji. Đánh số 1-2-3.</text><text x="66" y="475" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">Model reply</text><text x="66" y="495" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">1) Bảo mật SaaS: điều IT phải biết</text><text x="66" y="516" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">2) Webinar bảo mật dữ liệu — bản IT</text><text x="66" y="537" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">3) Dữ liệu của bạn, rủi ro của bạn</text></svg>
