<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="48" y="36" width="784" height="190" rx="22" fill="#ffffff" stroke="#fecaca" stroke-width="2"/><rect x="72" y="58" width="190" height="44" rx="12" fill="#dc2626" stroke="#cbd5e1" stroke-width="1.5"/><text x="182" y="80" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Yếu — mơ hồ</text><text x="72" y="132" font-size="17" font-weight="700" fill="#0f172a">Prompt</text><text x="72" y="154" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Giúp mình làm marketing với.</text><text x="72" y="188" font-size="17" font-weight="700" fill="#475569">Model reply</text><text x="72" y="200" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#475569">Chắc chắn rồi! Marketing là tiếp cận khách hàng. Nó quan</text><text x="72" y="220" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#475569">trọng vì…</text><rect x="48" y="254" width="784" height="190" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/><rect x="72" y="276" width="190" height="44" rx="12" fill="#16a34a" stroke="#cbd5e1" stroke-width="1.5"/><text x="182" y="298" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff">Mạnh — cụ thể</text><text x="72" y="350" font-size="17" font-weight="700" fill="#0f172a">Prompt</text><text x="72" y="337" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Bạn là copywriter B2B SaaS. Viết 3 tiêu đề email</text><text x="72" y="360" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">cho webinar về bảo mật dữ liệu, nhắm tới quản lý</text><text x="72" y="384" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">IT. Mỗi tiêu đề dưới 45 ký tự, không emoji. Đánh số</text><text x="72" y="407" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">1-2-3.</text><text x="72" y="406" font-size="17" font-weight="700" fill="#475569">Model reply</text><text x="72" y="418" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#475569">1) Bảo mật SaaS: điều IT phải biết
2) Webinar bảo mật dữ</text><text x="72" y="438" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#475569">liệu — bản IT
