<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 442" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="40" y="30" width="190" height="60" rx="14" fill="#7c3aed" stroke="#cbd5e1" stroke-width="1.5"/><text x="135" y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Role</text><rect x="244" y="30" width="596" height="60" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="264" y="50" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Bạn là biên tập viên kỳ cựu, chuyên rà soát bản</text><text x="264" y="73" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">nháp.</text><rect x="40" y="112" width="190" height="60" rx="14" fill="#2563eb" stroke="#cbd5e1" stroke-width="1.5"/><text x="135" y="150" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Context</text><rect x="244" y="112" width="596" height="60" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="264" y="132" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Sản phẩm của chúng tôi: app ghi chú cho sinh</text><text x="264" y="155" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">viên.</text><rect x="40" y="194" width="190" height="60" rx="14" fill="#16a34a" stroke="#cbd5e1" stroke-width="1.5"/><text x="135" y="232" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Task</text><rect x="244" y="194" width="596" height="60" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="264" y="214" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Viết lại đoạn này cho rõ ràng và trung lập.</text><rect x="40" y="276" width="190" height="60" rx="14" fill="#d97706" stroke="#cbd5e1" stroke-width="1.5"/><text x="135" y="314" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Format</text><rect x="244" y="276" width="596" height="60" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="264" y="296" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Trả lời 3 gạch đầu dòng, rồi 1 dòng tóm tắt.</text><rect x="40" y="358" width="190" height="60" rx="14" fill="#dc2626" stroke="#cbd5e1" stroke-width="1.5"/><text x="135" y="396" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Example</text><rect x="244" y="358" width="596" height="60" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="264" y="378" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Đưa 1 cặp trước → sau để định hình phong cách.</text></svg>
