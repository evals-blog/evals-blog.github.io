<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="40" y="36" width="170" height="64" rx="16" fill="#7c3aed" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="68" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">Role</text><rect x="222" y="36" width="618" height="64" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="244" y="56" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Bạn là biên tập viên kỳ cựu, chuyên rà soát bản</text><text x="244" y="80" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">nháp.</text><rect x="40" y="114" width="170" height="64" rx="16" fill="#2563eb" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="146" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">Context</text><rect x="222" y="114" width="618" height="64" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="244" y="146" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Sản phẩm của chúng tôi: app ghi chú cho sinh viên.</text><rect x="40" y="192" width="170" height="64" rx="16" fill="#16a34a" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="224" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">Task</text><rect x="222" y="192" width="618" height="64" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="244" y="224" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Viết lại đoạn này cho rõ ràng và trung lập.</text><rect x="40" y="270" width="170" height="64" rx="16" fill="#d97706" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="302" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">Format</text><rect x="222" y="270" width="618" height="64" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="244" y="302" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Trả lời 3 gạch đầu dòng, rồi 1 dòng tóm tắt.</text><rect x="40" y="348" width="170" height="64" rx="16" fill="#dc2626" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">Example</text><rect x="222" y="348" width="618" height="64" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="244" y="380" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Đưa 1 cặp trước → sau để định hình phong cách.</text></svg>
