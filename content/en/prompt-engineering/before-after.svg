 font-size="19" font-weight="500" fill="#0f172a">subject lines for a webinar on data security, aimed</text><text x="72" y="384" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">at IT managers. Keep each under 45 characters, no</text><text x="72" y="407" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">emojis. List them as 1-2-3.</text><text x="72" y="406" font-size="17" font-weight="700" fill="#475569">Model reply</text><text x="72" y="418" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#475569">1) Securing SaaS: what IT must know
