<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 406" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="28" y="40" width="400" height="346" rx="20" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/><rect x="48" y="62" width="360" height="60" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="228" y="84" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Closed book — model alone</text><path d="M 55 145 L 73 163 M 73 145 L 55 163" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><text x="84" y="148" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Answers only from memory</text><path d="M 55 194 L 73 212 M 73 194 L 55 212" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><text x="84" y="197" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Knowledge stops at the</text><text x="84" y="220" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">training cutoff</text><path d="M 55 266 L 73 284 M 73 266 L 55 284" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><text x="84" y="269" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">No access to your private</text><text x="84" y="292" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">documents</text><rect x="452" y="40" width="400" height="346" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><rect x="472" y="62" width="360" height="60" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/><text x="652" y="84" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Open book — with RAG</text><path d="M 478 154 l 6 6 l 12 -14" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="148" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Model reads the retrieved</text><text x="508" y="171" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">documents</text><path d="M 478 226 l 6 6 l 12 -14" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="220" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">Answers are grounded in</text><text x="508" y="243" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">your data</text><path d="M 478 298 l 6 6 l 12 -14" stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="292" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">It can point to the exact</text><text x="508" y="315" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="500" fill="#0f172a">source</text></svg>
