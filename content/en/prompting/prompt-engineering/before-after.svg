<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 873" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="44" y="36" width="792" height="229" rx="20" fill="#ffffff" stroke="#fecaca" stroke-width="2"/><rect x="66" y="52" width="210" height="34" rx="10" fill="#dc2626" stroke="#cbd5e1" stroke-width="1.5"/><text x="171" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Weak — vague</text><text x="66" y="108" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">Prompt</text><text x="66" y="128" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">Help me with marketing.</text><text x="66" y="168" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">Model reply</text><text x="66" y="188" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">Sure! Marketing is about reaching customers. It is important because…</text><rect x="44" y="295" width="792" height="578" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/><rect x="66" y="311" width="210" height="34" rx="10" fill="#16a34a" stroke="#cbd5e1" stroke-width="1.5"/><text x="171" y="333" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Strong — specific</text><text x="66" y="367" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">Prompt</text><text x="66" y="387" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">You are a B2B SaaS copywriter. Write 3 email subject lines for</text><text x="66" y="411" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">a webinar on data security, aimed at IT managers. Keep each</text><text x="66" y="435" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="19" font-weight="500" fill="#0f172a">under 45 characters, no emojis. List them as 1-2-3.</text><text x="66" y="475" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">Model reply</text><text x="66" y="495" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">1) Securing SaaS: what IT must know</text><text x="66" y="516" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">2) Data security webinar — IT edition</text><text x="66" y="537" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">3) Your stack, your data, their risk</text></svg>
