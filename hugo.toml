title = 'Evals Blog by Thuat Nguyen'
theme = 'ananke'

defaultContentLanguage = "vi"
defaultContentLanguageInSubdir = true

[params]
site_logo = "images/logo.jpg"
# The four topic sections below feed the homepage's recent-post listing.
mainSections = ["evals", "rag", "prompting", "daily-tips"]

[languages.vi]
label = "Vietnamese"
weight = 1
contentDir = 'content/vi'
baseURL = "https://evals-blog.github.io/vi/"

# Vietnamese convention: "ngày 5 tháng 9, 2026" instead of "tháng 9 5, 2026".
[languages.vi.params]
date_format = ":date_long"

[languages.en]
label = "English"
weight = 2
contentDir = 'content/en'
baseURL = "https://evals-blog.github.io/en/"
